<div class="dropdown">
  <button class="btn btn-xs btn-outline-secondary border-0 dropdown-toggle" type="button"
    id="bd-theme" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Theme">
    <span class="theme-icon-active"><img src="{{ report.presentation.style.theme_icon | e }}" width="24" height="24" alt="LSMC"></span>
  </button>
  <ul class="dropdown-menu" aria-labelledby="bd-theme">
    {% for name in report.presentation.style.menu %}
    <li><button type="button" class="dropdown-item" data-theme-value="{{ name | e }}" aria-pressed="false">{{ report.presentation.style.themes[name].label | e }}</button></li>
    {% endfor %}
  </ul>
</div>
